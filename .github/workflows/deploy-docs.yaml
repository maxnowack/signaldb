name: Deploy Documentation

on:
  workflow_dispatch:
  push:
    branches: ["main"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # necessary for lastUpdated field for pages
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Load node modules cache
        id: modules-cache
        uses: actions/cache@v6
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: |
            **/node_modules
          key: ${{ runner.OS }}-node-modules-${{ hashFiles('**/package-lock.json') }}
      # Installed from scratch, never on top of an older cache (see checks.yaml).
      - name: install modules
        if: steps.modules-cache.outputs.cache-hit != 'true'
        run: |
          npm ci --no-audit --force --loglevel=error --no-update-notifier
      # On CI, `docs:build` builds the v1 documentation from its tag. That is a
      # build of a fixed tag, so this cache is a hit on every run after the
      # first. The key covers the script because that is where the tag lives —
      # changing it is what should invalidate the cache.
      - name: Load v1 documentation cache
        uses: actions/cache@v5
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: .cache/v1-docs
          key: ${{ runner.OS }}-v1-docs-${{ hashFiles('.scripts/build-v1-docs.js') }}
      - name: Build vitepress
        run: npm run docs:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/.vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
